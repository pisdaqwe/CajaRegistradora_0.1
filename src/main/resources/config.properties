#############################################
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
#############################################

# Nombre del negocio (sale en el TPV y en los tickets)
app.name=TPV Cafetería

# Versión de la aplicación (informativo)
app.version=0.1.0

# Idioma del TPV
# es = español, en = inglés
app.language=es

# Zona horaria (para fechas de ventas y cierres)
app.timezone=Europe/Madrid

# Modo debug
# true  = desarrollo (más mensajes)
# false = producción
app.debug=true


#############################################
# CONFIGURACIÓN DE BASE DE DATOS (MARIADB)
#############################################

# Dirección de la base de datos
# Ahora: local
# Futuro: servidor remoto
db.url=jdbc:mariadb://localhost:3306/tpv_cafeteria

# Usuario de la base de datos
# En desarrollo usamos root
db.user=root

# Contraseña de la base de datos
db.password=root1234

# Driver JDBC (normalmente no se cambia)
db.driver=org.mariadb.jdbc.Driver


#############################################
# POOL DE CONEXIONES (HIKARICP)
#############################################

# Máximo de conexiones abiertas a la BD
db.pool.maxSize=10

# Mínimo de conexiones vivas
db.pool.minIdle=2

# Tiempo máximo de espera para conseguir conexión (ms)
db.pool.connectionTimeout=30000

# Tiempo máximo sin usar una conexión (ms)
db.pool.idleTimeout=600000

# Tiempo máximo de vida de una conexión (ms)
db.pool.maxLifetime=1800000


#############################################
# RUTAS DEL SISTEMA
#############################################

# Carpeta donde se guardan los tickets PDF
path.tickets=./data/tickets

# Carpeta de reportes PDF
path.reports=./data/reports

# Carpeta de logs
path.logs=./logs


#############################################
# CONFIGURACIÓN DE TICKETS
#############################################

# Ancho del ticket (mm)
tickets.width=80

# Formato del ticket
# TICKET = impresora térmica
# A4     = hoja normal
tickets.format=TICKET


#############################################
# IMPRESIÓN
#############################################

# Impresora por defecto (vacío = impresora del sistema)
printer.default=

# Activar impresión de cocina/barra
printer.kitchen.enabled=true


#############################################
# CAJA Y OPERACIÓN
#############################################

# Permitir más de una sesión por caja
caja.permitirMultiplesSesiones=false

# Obligar a cerrar caja al salir del TPV
caja.forzarCierre=true


#############################################
# LOCALIZACIÓN Y MONEDA
#############################################

# Idioma para Locale de Java
locale.language=es
locale.country=ES

# Moneda del TPV
currency=EUR





